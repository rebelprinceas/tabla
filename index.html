<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acoustic Sample Tabla</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.25rem; text-align: center; margin-bottom: 6px; }
    p.sub { font-size: 0.8rem; color: #94a3b8; text-align: center; margin-bottom: 16px; }
    .card { background: #1e293b; border-radius: 12px; padding: 18px; border: 1px solid #334155; }
    label { font-size: 0.8rem; color: #cbd5e1; font-weight: 600; display: block; margin-top: 10px; }
    textarea, input, select { width: 100%; padding: 10px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; font-size: 0.9rem; margin-top: 5px; }
    textarea { height: 75px; }
    .controls { display: flex; gap: 8px; margin-top: 14px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; }
    .btn-play { background: #3b82f6; color: white; }
    .btn-stop { background: #ef4444; color: white; }
    .btn-export { background: #10b981; color: white; margin-top: 10px; width: 100%; }
    #status { font-size: 0.8rem; color: #38bdf8; text-align: center; margin-top: 10px; min-height: 1.2em; }
  </style>
</head>
<body>

  <h1>Acoustic Tabla Player</h1>
  <p class="sub">Real Recorded Drum Samples &bull; No Synthetic Tones</p>

  <div class="card">
    <div id="status">Loading sample audio...</div>

    <label for="bolInput">Taal / Bols:</label>
    <textarea id="bolInput">Dha Dhin Dhin Dha | Dha Dhin Dhin Dha | Dha Tin Tin Ta | Ta Dhin Dhin Dha</textarea>

    <div style="display: flex; gap: 8px;">
      <div style="flex: 1;">
        <label for="bpm">BPM (Speed):</label>
        <input type="number" id="bpm" value="135" min="40" max="300" />
      </div>
      <div style="flex: 1;">
        <label for="groove">Human Groove:</label>
        <select id="groove">
          <option value="tight">Strict (Machine)</option>
          <option value="human" selected>Human Feel</option>
        </select>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-play" id="playBtn" onclick="togglePlay()" disabled>Play</button>
    </div>
    <button class="btn btn-export" id="exportBtn" onclick="exportWav()" disabled>Download Track (.WAV)</button>
  </div>

  <script>
    const sampleNames = ['dha', 'dhin', 'ge', 'na', 'tin', 'kat', 'tirakit'];
    const sampleBuffers = {};
    let audioCtx = null;
    let isPlaying = false;
    let timerId = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Preload audio files from the repo
    async function loadSamples() {
      const statusEl = document.getElementById("status");
      try {
        initAudio();
        for (const name of sampleNames) {
          const res = await fetch(`samples/${name}.wav`);
          if (!res.ok) throw new Error(`Missing samples/${name}.wav`);
          const arrayBuf = await res.arrayBuffer();
          sampleBuffers[name] = await audioCtx.decodeAudioData(arrayBuf);
        }
        statusEl.innerText = "✓ Acoustic samples loaded and ready";
        statusEl.style.color = "#4ade80";
        document.getElementById("playBtn").disabled = false;
        document.getElementById("exportBtn").disabled = false;
      } catch (err) {
        statusEl.innerText = "Error loading samples: " + err.message;
        statusEl.style.color = "#f87171";
      }
    }

    window.addEventListener("DOMContentLoaded", loadSamples);

    function getBufferForBol(bol) {
      bol = bol.toLowerCase().replace(/[^a-z]/g, '');
      if (bol === 'ta') return sampleBuffers['na'];
      if (bol === 'ga') return sampleBuffers['ge'];
      if (bol === 'ka' || bol === 'ke') return sampleBuffers['kat'];
      if (bol === 'ti' || bol === 'te' || bol === 're') return sampleBuffers['tirakit'];
      return sampleBuffers[bol] || null;
    }

    function playStroke(ctx, destination, bol, time, velocity) {
      const buffer = getBufferForBol(bol);
      if (!buffer) return;

      const src = ctx.createBufferSource();
      src.buffer = buffer;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(velocity, time);

      src.connect(gain);
      gain.connect(destination);
      src.start(time);
    }

    function parseBols() {
      const text = document.getElementById('bolInput').value;
      return text.replace(/[|,]/g, ' ').split(/\s+/).filter(b => b.trim().length > 0);
    }

    function togglePlay() {
      initAudio();
      if (isPlaying) {
        stopPlay();
      } else {
        startPlay();
      }
    }

    function startPlay() {
      const bols = parseBols();
      if (!bols.length) return;

      isPlaying = true;
      document.getElementById('playBtn').innerText = "Stop";
      document.getElementById('playBtn').className = "btn btn-stop";

      const bpm = parseInt(document.getElementById('bpm').value) || 135;
      const groove = document.getElementById('groove').value;
      const beatSec = 60 / bpm;
      let currentIndex = 0;

      function step() {
        if (!isPlaying) return;

        let velocity = (currentIndex === 0) ? 1.0 : (currentIndex % 4 === 0) ? 0.88 : 0.74;
        let jitter = (groove === 'human') ? (Math.random() - 0.5) * 0.012 : 0;
        let scheduleTime = Math.max(audioCtx.currentTime, audioCtx.currentTime + jitter);

        playStroke(audioCtx, audioCtx.destination, bols[currentIndex], scheduleTime, velocity);

        currentIndex = (currentIndex + 1) % bols.length;
        timerId = setTimeout(step, beatSec * 1000);
      }
      step();
    }

    function stopPlay() {
      isPlaying = false;
      clearTimeout(timerId);
      document.getElementById('playBtn').innerText = "Play";
      document.getElementById('playBtn').className = "btn btn-play";
    }

    // Offline Export using Real Samples
    async function exportWav() {
      const bols = parseBols();
      if (!bols.length) return;

      const bpm = parseInt(document.getElementById('bpm').value) || 135;
      const groove = document.getElementById('groove').value;
      const beatSec = 60 / bpm;
      const totalDuration = (bols.length * beatSec) + 1.5;
      const sampleRate = 44100;

      const offlineCtx = new OfflineAudioContext(2, Math.ceil(sampleRate * totalDuration), sampleRate);

      bols.forEach((bol, i) => {
        let velocity = (i === 0) ? 1.0 : (i % 4 === 0) ? 0.88 : 0.74;
        let jitter = (groove === 'human') ? (Math.random() - 0.5) * 0.012 : 0;
        let playTime = Math.max(0, (i * beatSec) + jitter);
        playStroke(offlineCtx, offlineCtx.destination, bol, playTime, velocity);
      });

      const buffer = await offlineCtx.startRendering();
      const wavBlob = bufferToWave(buffer, buffer.length);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(wavBlob);
      a.download = "acoustic_tabla_track.wav";
      a.click();
    }

    function bufferToWave(abuffer, len) {
      const numOfChan = abuffer.numberOfChannels;
      const length = len * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      const channels = [];
      let sample = 0, offset = 0, pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
      setUint32(0x20746d66); setUint32(16); setUint16(1);
      setUint16(numOfChan);
      setUint32(abuffer.sampleRate);
      setUint32(abuffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      setUint32(0x61746164); setUint32(length - pos - 4);

      for (let i = 0; i < numOfChan; i++) channels.push(abuffer.getChannelData(i));

      while (pos < length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }
      return new Blob([out], { type: "audio/wav" });
    }
  </script>
</body>
</html>
